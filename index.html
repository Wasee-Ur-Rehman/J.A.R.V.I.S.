<!doctype html>
<html lang="en">
  <head>
    <title>J.A.R.V.I.S | UI Dashboard</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.js"></script>
    <style>
      body {
        background: #0b0e14;
        color: #00f2ff;
        font-family: "Segoe UI", sans-serif;
      }
      .glass-card {
        background: rgba(20, 30, 40, 0.6);
        backdrop-filter: blur(10px);
        border: 1px solid #00f2ff;
        border-radius: 15px;
        transition: 0.3s;
      }
      .glass-card:hover {
        transform: scale(1.05);
        box-shadow: 0 0 20px #00f2ff;
      }
      .btn-jarvis {
        border: 1px solid #00f2ff;
        color: #00f2ff;
        background: transparent;
      }
      .btn-jarvis:hover {
        background: #00f2ff;
        color: #000;
      }
      h1 {
        text-transform: uppercase;
        letter-spacing: 5px;
        text-shadow: 0 0 10px #00f2ff;
      }
    </style>
  </head>
  <body>
    <div class="container mt-5">
      <h1 class="text-center mb-5">J.A.R.V.I.S System Status</h1>

      <div class="row g-4">
        <div class="col-md-4">
          <div class="glass-card p-4 text-center">
            <h5 class="text-uppercase">Temperature</h5>
            <h2 id="temp-display" class="mt-3">-- °C</h2>
          </div>
        </div>
        <div class="col-md-4">
          <div class="glass-card p-4 text-center">
            <h5 class="text-uppercase">Humidity</h5>
            <h2 id="humid-display" class="mt-3">-- %</h2>
          </div>
        </div>
        <div class="col-md-4">
          <div class="glass-card p-4 text-center">
            <h5 class="text-uppercase">Fan Status</h5>
            <h2 id="fan-display" class="mt-3">--</h2>
          </div>
        </div>
      </div>

      <div class="mt-5 text-center">
        <button
          class="btn btn-jarvis btn-lg mx-2"
          onclick="publishCmd('fan', 'ON')"
        >
          FAN ON
        </button>
        <button
          class="btn btn-jarvis btn-lg mx-2"
          onclick="publishCmd('fan', 'OFF')"
        >
          FAN OFF
        </button>
      </div>
    </div>

    <script>
      client = new Paho.MQTT.Client(
        "gc9ff996.ala.asia-southeast1.emqxsl.com",
        8084,
        "web_dashboard",
      );

      client.onMessageArrived = (msg) => {
        const val = msg.payloadString;
        if (msg.destinationName.endsWith("temp"))
          document.getElementById("temp-display").innerText = val + " °C";
        if (msg.destinationName.endsWith("humidity"))
          document.getElementById("humid-display").innerText = val + " %";
        if (msg.destinationName.endsWith("fan"))
          document.getElementById("fan-display").innerText = val;
      };

      client.connect({
        useSSL: true,
        userName: "example_user",
        password: "example_pass",
        onSuccess: () => {
          client.subscribe("fastnu/companion/#");
          console.log("J.A.R.V.I.S Connected");
        },
      });

      function publishCmd(topic, payload) {
        let msg = new Paho.MQTT.Message(payload);
        msg.destinationName = "fastnu/companion/control/" + topic;
        client.send(msg);
      }
    </script>
  </body>
</html>
